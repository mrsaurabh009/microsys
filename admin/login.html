<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Microsys Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/design-system.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-brand">
          <img src="../assets/primary-microsys-png.png" alt="Microsys" style="height: 40px; width: auto; object-fit: contain;">
          <span class="login-brand-badge">ADMIN</span>
        </div>
        <h1 class="login-title">Microsys Admin</h1>
        <p class="login-subtitle">Enter your credentials to access the management portal</p>
      </div>

      <!-- PHP Error Message Placeholder -->
      <div id="login-error" class="login-error" style="display: none;"></div>

      <form id="admin-login-form" method="POST">
        <!-- CSRF Token Placeholder for PHP backend -->
        <input type="hidden" name="csrf_token" value="[PHP: echo $csrf_token;]">

        <div class="form-group">
          <label for="admin_email">Email</label>
          <input 
            type="email" 
            id="admin_email" 
            name="admin_email" 
            required 
            autocomplete="username" 
            placeholder="admin@microsys.com"
          >
        </div>

        <div class="form-group">
          <div class="form-label-row">
            <label for="admin_password">Password</label>
            <a href="#" class="login-forgot-link">Forgot Password?</a>
          </div>
          <input 
            type="password" 
            id="admin_password" 
            name="admin_password" 
            required 
            autocomplete="current-password" 
            placeholder="••••••••"
          >
        </div>

        <button type="submit" class="btn-primary">Secure Login</button>
      </form>
    </div>
  </div>
</body>
</html>
